name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      sha:
        description: 'Git commit SHA to rollback to'
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/jack-dolan/letsgogaming

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set PATH
        run: echo "/opt/homebrew/bin:/usr/local/bin" >> $GITHUB_PATH

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Login to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0  # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Install Trivy
        run: brew install trivy

      - name: Scan image for vulnerabilities
        run: |
          trivy image \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --skip-dirs /usr/local/lib/node_modules/npm \
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Patch image tag
        run: sed -i '' "s|letsgogaming:latest|letsgogaming:${{ github.sha }}|" k8s/deployment.yaml

      - name: Deploy manifests
        run: kubectl apply -k k8s

      - name: Wait for rollout
        run: kubectl rollout status deployment/letsgogaming -n production --timeout=180s

  cleanup:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Clean up old image versions
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55  # v5
        with:
          package-name: letsgogaming
          package-type: container
          min-versions-to-keep: 20
          ignore-versions: ^latest$
          token: ${{ secrets.GITHUB_TOKEN }}

  rollback:
    if: github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    steps:
      - name: Set PATH
        run: echo "/opt/homebrew/bin:/usr/local/bin" >> $GITHUB_PATH

      - name: Rollback to SHA
        run: |
          kubectl set image deployment/letsgogaming \
            letsgogaming=${{ env.IMAGE_NAME }}:${{ inputs.sha }} \
            -n production

      - name: Wait for rollout
        run: kubectl rollout status deployment/letsgogaming -n production --timeout=180s
