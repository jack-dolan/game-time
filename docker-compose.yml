services:
  letsgogaming:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      # CORS allowlist Socket.io checks the browser's origin against. This
      # compose file is for local use, so it names the local origin. The
      # deployed instance sets its own value in the platform.
      - ALLOWED_ORIGINS=http://localhost:8080
