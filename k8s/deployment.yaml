apiVersion: apps/v1
kind: Deployment
metadata:
  name: letsgogaming
  labels:
    app: letsgogaming
spec:
  replicas: 1
  selector:
    matchLabels:
      app: letsgogaming
  template:
    metadata:
      labels:
        app: letsgogaming
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: letsgogaming
          image: ghcr.io/jack-dolan/letsgogaming:latest
          imagePullPolicy: Always
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "8080"
            - name: ALLOWED_ORIGINS
              value: "https://letsgogaming.dolanjack.com"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
